<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are Beautiful ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffe6f2;
        font-family: Poppins, sans-serif;
        text-align: center;
        animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    h2 {
        font-size: 2em;
        color: #d81b60;
        margin-top: 40px;
        font-weight: 600;
    }

    .word {
        font-size: 1.7em;
        color: #b40052;
        opacity: 0;
        animation: wordFade 1s forwards;
        font-weight: 600;
        margin: 12px 0;
    }

    @keyframes wordFade {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .next-btn {
        display: inline-block;
        margin: 40px auto;
        background: #ff4f8b;
        padding: 14px 30px;
        color: white;
        border-radius: 30px;
        text-decoration: none;
        font-size: 1.3em;
        font-weight: 600;
    }
</style>
</head>

<body>

<h2>I know what you are thinking…  
<br>Because you are not just beautiful…  
<br>You are…</h2>

<div id="words"></div>

<script>
const w = [
    "Gorgeous","Stunning","Radiant","Elegant","Charming","Graceful","Captivating",
    "Mesmerising","Adorable","Lovely","Angelic","Enchanting","Magical","Dreamy",
    "Flawless","Irresistible","Dazzling","Precious","Alluring","Ravishing",
    "Classy","Sparkling","Cute","Sweet","Perfect","Breathtaking","Glowing",
    "Divine","Blissful","Exquisite","Heavenly","Vibrant","Mine ♡"
];
let i = 0;

function show() {
    if (i < w.length) {
        let d = document.createElement("div");
        d.className = "word";
        d.textContent = w[i];
        if (w[i] === "Mine ♡") d.style.textShadow = "0 0 10px #ff5fa2";
        document.getElementById("words").appendChild(d);
        i++;
        setTimeout(show, 450);
    }
}
show();
</script>

<a class="next-btn" href="page3.html">Next ➜</a>

<!-- MUSIC -->
<audio id="bgMusic" autoplay loop>
    <source src="https://files.catbox.moe/6u9f3p.mp3">
</audio>

<script>
document.addEventListener("click", () => {
    document.getElementById("bgMusic").play();
}, { once: true });
</script>

</body>
</html>
