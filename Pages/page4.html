<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dandelions Lyrics ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 25px;
        background: #fff0f7;
        font-family: Poppins, sans-serif;
        text-align: center;
        animation: fadeIn 1.5s ease;
        overflow-x: hidden;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    h1 {
        font-family: 'Dancing Script', cursive;
        font-size: 2.6em;
        color: #d81b60;
        margin-bottom: 10px;
    }

    .quote {
        font-size: 1.2em;
        color: #a80052;
        margin-top: -10px;
        font-style: italic;
    }

    .line {
        font-size: 1.5em;
        color: #6a0046;
        margin: 18px 0;
        font-family: 'Dancing Script', cursive;
        opacity: 0;
        animation: fadeUp 1s forwards;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Hidden audio icon */
    audio {
        display: none;
    }

    .next-btn {
        margin-top: 40px;
        display: inline-block;
        padding: 15px 25px;
        background: #ff4f8b;
        color: white;
        border-radius: 25px;
        font-size: 1.3em;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
</style>
</head>

<body>

<h1>Dandelions 🌼 For My Sriyuuu 💗</h1>
<div class="quote">"Every smile of yours feels like magic to me." ✨</div>

<!-- HIDDEN MUSIC -->
<audio id="bgm" loop>
    <source src="../dd.mp3" type="audio/mpeg">
</audio>

<div id="lyrics"></div>

<!-- NEXT PAGE BUTTON -->
<a href="page5.html" class="next-btn">Next 💗</a>

<script>
// LYRICS LIST
const lines = [
    "I've heard of a love that comes once in a lifetime",
    "And I'm pretty sure that you are that love of mine 💗",
    "'Cause I'm in a field of dandelions",
    "Wishing on every one that you'd be mine, mine ✨",
    "And I see forever in your eyes",
    "I feel okay when I see you smile, smile 😊"
];

let i = 0;

// ANIMATE LYRICS LINE BY LINE
function showLyrics() {
    if (i < lines.length) {
        const l = document.createElement("div");
        l.className = "line";
        l.innerText = lines[i];
        document.getElementById("lyrics").appendChild(l);
        i++;
        setTimeout(showLyrics, 2000);
    }
}

// PLAY MUSIC ON FIRST TAP
document.addEventListener("click", () => {
    document.getElementById("bgm").play();
}, { once: true });

// Start lyrics animation
showLyrics();
</script>

</body>
</html>
