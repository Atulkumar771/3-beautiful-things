<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dandelions Lyrics ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 25px;
        background: #fff0f7;
        font-family: Poppins;
        text-align: center;
        animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    h1 {
        font-size: 2.4em;
        color: #d81b60;
        font-weight: bold;
        font-family: 'Dancing Script', cursive;
    }

    audio {
        width: 90%;
        max-width: 420px;
        margin-top: 20px;
        border-radius: 10px;
        outline: none;
    }

    .lyrics {
        margin-top: 35px;
        font-size: 1.5em;
        line-height: 1.7em;
        color: #6a0046;
        white-space: pre-line;
        font-family: 'Dancing Script', cursive;
    }
</style>
</head>

<body>

<h1>Dandelions 🌼 For You, My Sriyuuu 💗</h1>

<!-- Fixed Audio Player -->
<audio id="music" controls autoplay muted onplay="this.muted=false">
    <source src="https://files.catbox.moe/6u9f3p.mp3" type="audio/mpeg">
</audio>

<div class="lyrics">

I've heard of a love that comes once in a lifetime  
And I'm pretty sure that you are that love of mine 💗  

'Cause I'm in a field of dandelions  
Wishing on every one that you'd be mine, mine ✨  

And I see forever in your eyes  
I feel okay when I see you smile, smile 😊  

</div>

</body>
</html>
