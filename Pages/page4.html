<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dandelions Lyrics ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 25px;
        background: #fff0f7;
        font-family: Poppins, sans-serif;
        text-align: center;
        overflow-x: hidden;
    }

    h1 {
        font-family: 'Dancing Script', cursive;
        font-size: 2.6em;
        color: #d81b60;
        margin-top: 20px;
        opacity: 0;
        animation: fadeIn 1.5s forwards 0.5s;
    }

    .quote {
        font-size: 1.2em;
        color: #a80052;
        margin-top: -5px;
        font-style: italic;
        opacity: 0;
        animation: fadeIn 1.5s forwards 1.2s;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Lyrics lines */
    .line {
        font-size: 1.5em;
        color: #6a0046;
        margin: 18px 0;
        opacity: 0;
        font-family: 'Dancing Script', cursive;
        animation: fadeUp 1s forwards;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Hidden audio */
    audio {
        display: none;
    }

    /* Heart Start Button */
    #startHeart {
        font-size: 3.5em;
        margin-top: 80px;
        cursor: pointer;
        animation: pulse 1.5s infinite;
        color: #ff4f8b;
        text-shadow: 0 0 15px #ff9ac8;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 0.9; }
    }

    /* Next button */
    .next-btn {
        margin-top: 40px;
        display: inline-block;
        padding: 15px 25px;
        background: #ff4f8b;
        color: white;
        border-radius: 25px;
        font-size: 1.3em;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        opacity: 0;
        animation: fadeIn 2s forwards 10s;
    }
</style>
</head>

<body>

<h1>Dandelions 🌼 For My Sriyuuu 💗</h1>
<div class="quote">"Every smile of yours feels like magic to me." ✨</div>

<!-- HEART BUTTON -->
<div id="startHeart">💗</div>

<!-- Hidden audio -->
<audio id="bgm" loop>
    <source src="../dd.mp3" type="audio/mpeg">
</audio>

<!-- Lyrics container -->
<div id="lyrics"></div>

<!-- Next Page Button -->
<a href="page5.html" class="next-btn">Next 💗</a>

<script>
const lines = [
    "I've heard of a love that comes once in a lifetime",
    "And I'm pretty sure that you are that love of mine 💗",
    "'Cause I'm in a field of dandelions",
    "Wishing on every one that you'd be mine, mine ✨",
    "And I see forever in your eyes",
    "I feel okay when I see you smile, smile 😊"
];

let i = 0;

// Show lyrics line-by-line
function showLyrics() {
    if (i < lines.length) {
        const elem = document.createElement("div");
        elem.className = "line";
        elem.innerText = lines[i];
        elem.style.animationDelay = "0s";
        document.getElementById("lyrics").appendChild(elem);
        i++;
        setTimeout(showLyrics, 2000);
    }
}

// When heart is tapped
document.getElementById("startHeart").addEventListener("click", () => {
    // Play music
    document.getElementById("bgm").play();

    // Remove heart
    document.getElementById("startHeart").style.display = "none";

    // Start lyrics
    showLyrics();
});
</script>

</body>
</html>
